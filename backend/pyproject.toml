[project]
name = "ai-cv-screener-backend"
version = "0.1.0"
description = "CvScreener — FastAPI backend"
requires-python = ">=3.10"

# Dependencies live in requirements.txt / requirements-dev.txt rather than here.
# This file exists for tool configuration; the backend is run from source, not
# installed as a package.

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
]
ignore = [
    "B008",  # function call in argument default — this is how FastAPI Depends() works
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]  # sys.path must be set before app imports

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "requires_db: test needs a reachable PostgreSQL instance",
]
